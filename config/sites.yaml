# Crawler settings
crawler_settings:
  max_depth: 5
  max_pages: 1000
  delay_between_requests: 1.0  # seconds
  max_concurrent_requests: 10
  timeout: 30
  user_agent: "M-G CAFE Accessibility Checker 1.0"
  respect_robots_txt: true
  allowed_domains:
    - "mgcafe.uky.edu"
    - "ca.uky.edu"
    - "rs.uky.edu"
    - "ccd.uky.edu"
    - "www.uky.edu"
    - "engagement.uky.edu"
    # "stg.uky.ag"
  
# Output settings
output:
  format: "json"  # json, csv, or both
  include_html: false
  include_headers: true
  include_links: true

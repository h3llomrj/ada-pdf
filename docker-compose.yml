services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: ada_pdf_db
    environment:
      POSTGRES_DB: ada_pdf
      POSTGRES_USER: ada_pdf_user
      POSTGRES_PASSWORD: ada_pdf_password
      # Dev-only: trusts all local connections. Do NOT deploy this as-is.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - ada_pdf_network
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: ada_pdf_redis
    ports:
      - "6379:6379"
    networks:
      - ada_pdf_network
    restart: unless-stopped

  # Backend FastAPI Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ada_pdf_backend
    environment:
      - DATABASE_URL=postgresql://ada_pdf_user:ada_pdf_password@db:5432/ada_pdf
      - REDIS_URL=redis://redis:6379
      - PYTHONPATH=/app
    volumes:
      - ./output:/app/output
      - ./config:/app/config
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    networks:
      - ada_pdf_network
    restart: unless-stopped

  # Frontend React Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ada_pdf_frontend
    ports:
      - "3030:80"
    depends_on:
      - backend
    networks:
      - ada_pdf_network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: ada_pdf_nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - ada_pdf_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:

networks:
  ada_pdf_network:
    driver: bridge
